<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Sister!</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #ffccd5; /* لون بينك فاتح ومميز للبنات */
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      text-align: center;
      position: relative;
    }

    /* خلفية القلوب الصغيرة المتحركة */
    .floating-heart {
      position: absolute;
      color: #ff4d6d;
      font-size: 18px;
      opacity: 0.6;
      animation: floatUp 4s linear infinite;
      z-index: 1;
      pointer-events: none;
    }

    /* زر البداية لتشغيل الصوت بسلاسة */
    #startBtn {
      z-index: 100;
      padding: 15px 35px;
      font-size: 1.3rem;
      border-radius: 30px;
      border: none;
      background: #e60023;
      color: white;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 8px 20px rgba(230, 0, 35, 0.4);
      transition: 0.3s;
    }
    #startBtn:hover {
      transform: scale(1.05);
      background: #d90429;
    }

    /* العد التنازلي */
    #countdown {
      display: none;
      font-size: 9rem;
      font-weight: bold;
      color: #d90429;
      animation: pulse 1s infinite;
      z-index: 10;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.1);
    }

    /* القلب الكبير */
    .heart-container {
      display: none;
      position: relative;
      width: 250px;
      height: 220px;
      animation: popIn 1s ease-out forwards;
      z-index: 10;
      margin: 0 auto;
    }
    .heart {
      background-color: #e60023; /* لون أحمر زاهي */
      display: inline-block;
      height: 200px;
      position: relative;
      width: 200px;
      transform: rotate(-45deg);
      box-shadow: 0 10px 25px rgba(230, 0, 35, 0.4);
    }
    .heart:before,
    .heart:after {
      content: "";
      background-color: #e60023;
      border-radius: 50%;
      height: 200px;
      position: absolute;
      width: 200px;
    }
    .heart:before {
      top: -100px;
      left: 0;
    }
    .heart:after {
      left: 100px;
      top: 0;
    }
    .heart-text {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ffffff;
      font-size: 2rem;
      font-weight: bold;
      width: 100%;
      z-index: 20;
      font-family: Arial, sans-serif;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.3);
    }

    /* قسم الصورة والنص */
    #content-section {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      max-width: 600px;
      padding: 20px;
      animation: fadeIn 1.5s ease-in forwards;
      z-index: 10;
    }
    #content-section img {
      width: 260px;
      height: 260px;
      object-fit: cover;
      border-radius: 50%;
      border: 6px solid #e60023;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
    }
    #content-section p {
      font-size: 1.3rem;
      color: #590d22;
      line-height: 1.8;
      background: rgba(255, 255, 255, 0.9);
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      font-weight: 500;
    }

    /* الأنيميشن والحركات */
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      80% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes floatUp {
      0% {
        transform: translateY(100vh) scale(0.5);
        opacity: 0.8;
      }
      100% {
        transform: translateY(-10vh) scale(1.2);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <!-- ملف الأغنية (قم باستبدال birthday-song.mp3 باسم أو رابط الأغنية لديك) -->
  <audio id="birthdaySong" src="عيد ميلاد.mp3" preload="auto" loop></audio>

  <!-- زر البداية -->
  <button id="startBtn" onclick="startSurprise()">اضغط هنا لبدء المفاجأة 🎁</button>

  <!-- 1. العد التنازلي -->
  <div id="countdown">3</div>

  <!-- 2. القلب الأحمـر الكبير -->
  <div class="heart-container" id="heartContainer">
    <div class="heart"></div>
    <div class="heart-text">Happy Birthday💗</div>
  </div>

  <!-- 3. الصورة والكلام -->
  <div id="content-section">
    <img src="1792243178045.jpg" alt="صورة عائلية">
    <p>
      كل سنة وانتِ أطيب وأجمل أخت في الدنيا! ❤️
      <br><br>
      "ماريز" كل سنه وانتي طيبه يا احلي واجمل اخت وعقبال مليون سنه حلوه وتحققي الي بتتمنيه واشوفك احسن صيدليه💗☺️ويارب تكون الهديه عجبتك💝
    </p>
  </div>
  <script>
    // إنشاء قلوب صغيرة متساقطة في الخلفية
    function createHearts() {
      for (let i = 0; i < 25; i++) {
        let heart = document.createElement('div');
        heart.className = 'floating-heart';
        heart.innerHTML = '❤️';
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
        heart.style.fontSize = (Math.random() * 15 + 10) + 'px';
        document.body.appendChild(heart);
      }
    }
    createHearts();

    const startBtn = document.getElementById('startBtn');
    const countdownEl = document.getElementById('countdown');
    const heartContainer = document.getElementById('heartContainer');
    const contentSection = document.getElementById('content-section');
    const birthdaySong = document.getElementById('birthdaySong');

    // تشغيل الصوت والبدء بالمفاجأة عند الضغط على الزر
    function startSurprise() {
      birthdaySong.play().catch(e => console.log("خطأ في تشغيل الصوت:", e));

      startBtn.style.display = 'none';
      countdownEl.style.display = 'block';

      let remaining = 3;
      const countdownTimer = setInterval(() => {
        remaining -= 1;

        if (remaining > 0) {
          countdownEl.textContent = remaining;
          return;
        }

        clearInterval(countdownTimer);
        countdownEl.style.display = 'none';
        heartContainer.style.display = 'block';

        setTimeout(() => {
          heartContainer.style.display = 'none';
          contentSection.style.display = 'flex';
        }, 2500);
      }, 1000);
    }
  </script>
</body>
</html>
